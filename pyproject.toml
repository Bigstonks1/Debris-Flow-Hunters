[project]
name = "debris-flow-hunters"
version = "0.1.0"
description = "Post-fire debris-flow hazard maps for any US wildfire: an independent, unofficial run of the USGS models"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "paramiko>=5.0.0",
    "pfdf>=3.0.2",
    "wildcat>=1.1.1",
]

[[tool.uv.index]]
url = "https://code.usgs.gov/api/v4/groups/859/-/packages/pypi/simple"

[tool.ruff]
extend-exclude = ["data", "whitepaper"]

[tool.ruff.lint]
# Ruff's default rules (real errors: undefined names, unused imports, syntax), minus two
# style rules this code deliberately breaks: short lambdas (E731) and `l` for a line (E741).
ignore = ["E731", "E741"]
